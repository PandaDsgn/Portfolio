<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO | MENU</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
</head>
<body class="projects-page">
    <div class="bg-vignette"></div>
    <div class="hud-crosshair top-left"></div>
    <div class="hud-crosshair top-right"></div>
    <div class="hud-crosshair bottom-left"></div>
    <div class="hud-crosshair bottom-right"></div>
    <nav>
        <div class="logo">PORTFOLIO_V1.0</div>
        <div class="nav-links">
            <a href="index.html" id="shutdown-btn">SHUTDOWN</a>
        </div>
    </nav>
    <main class="project-container">
        <header class="sub-page-header">
            <h1 class="split-me">MAIN MENU</h1>
        </header>
        <section class="grid-layout">
            <div class="card" onclick="window.location.href='profile.html'">
                <h2 class="split-me">PROFILE</h2>
                <p class="split-me">IDENTITY & EDUCATION</p>
            </div>
            <div class="card" onclick="window.location.href='experience.html'">
                <h2 class="split-me">EXPERIENCE</h2>
                <p class="split-me">JOB HISTORY & TIMELINE</p>
            </div>
            <div class="card" onclick="window.location.href='skillsets.html'">
                <h2 class="split-me">SKILLSETS</h2>
                <p class="split-me">LANGUAGES, TOOLS & FRAMEWORKS</p>
            </div>
            <div class="card" onclick="window.location.href='projects.html'">
                <h2 class="split-me">PROJECTS</h2>
                <p class="split-me">COMPILED BUILDS & CASE STUDIES</p>
            </div>
            <div class="card" onclick="window.location.href='network.html'">
                <h2 class="split-me">NETWORK</h2>
                <p class="split-me">SOCIAL GRID AND EXTERNAL LINKS</p>
            </div>
            <div class="card" onclick="window.location.href='uplink.html'">
                <h2 class="split-me">UPLINK</h2>
                <p class="split-me">DIRECT COMMUNICATION</p>
            </div>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
