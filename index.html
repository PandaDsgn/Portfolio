<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO | HOME</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-vignette"></div>
    <div class="hud-crosshair top-left"></div>
    <div class="hud-crosshair top-right"></div>
    <div class="hud-crosshair bottom-left"></div>
    <div class="hud-crosshair bottom-right"></div>
    <nav>
        <div class="logo">PORTFOLIO_V1.0</div>
    </nav>
    <main>
        <div class="hero-pin-wrapper">
            <section class="hero">
                <div class="hero-row">
                    <h1 id="text-imagine" class="split-me" data-value="IMAGINE.">IMAGINE.</h1>
                    <div class="deco-lines from-right"></div>
                </div>
                <div class="hero-row right-align">
                    <div class="deco-lines from-left"></div>
                    <h1 id="text-execute" class="split-me text-blue" data-value="EXECUTE.">EXECUTE.</h1>
                </div>
                <div class="btn-container">
                    <button id="enter-btn" data-value="ACCESS_PROFILE">ACCESS_PROFILE</button>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
